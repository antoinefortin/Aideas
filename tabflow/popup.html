<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabflow</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><span class="logo">◉</span><strong>TABFLOW</strong></div><span class="tag">TAB AUDIO STUDIO</span></header>
<main><div class="eyebrow">LE SON, À TA FAÇON.</div><h1>Prends le contrôle.</h1><p id="tab-title">Onglet actuel</p><button id="power" class="power">Activer sur cet onglet</button><p id="status" role="status" aria-live="polite">Prêt à écouter.</p>
<fieldset id="controls" disabled><section class="volume"><label for="volume">Volume <output id="volume-out">100 %</output></label><input id="volume" type="range" min="0" max="400" step="5" value="100"><div class="scale"><span>Silence</span><span>100 %</span><span>400 %</span></div></section>
<section><div class="section-title"><h2>Égaliseur</h2><select id="preset" aria-label="Préréglage"><option value="custom">Personnalisé</option><option value="flat" selected>Neutre</option><option value="music">Musique</option><option value="voice">Voix & podcasts</option><option value="cinema">Cinéma</option><option value="bass">Basses profondes</option></select></div><div id="eq" class="eq"></div></section>
<section><h2>La petite touche</h2><label for="bass">Basses <output id="bass-out">0 dB</output></label><input id="bass" type="range" min="0" max="12" value="0"><label for="clarity">Clarté des voix <output id="clarity-out">0 dB</output></label><input id="clarity" type="range" min="0" max="8" value="0"><label for="space">Ambiance · écho court <output id="space-out">0 %</output></label><input id="space" type="range" min="0" max="60" value="0"><div class="toggles"><label><input id="night" type="checkbox">Mode nuit <small>Réduit les écarts de volume</small></label><label><input id="mono" type="checkbox">Mono <small>Voix centrées, deux canaux réunis</small></label><label><input id="bypass" type="checkbox">Son original <small>Compare sans tes réglages</small></label></div></section><button id="reset" class="reset">Réinitialiser les réglages</button></fieldset>
<footer>Traitement local · Réglages indépendants par onglet.<br>Le boost peut saturer à fort niveau. Un compresseur réduit les crêtes.</footer></main><script type="module" src="popup.js"></script></body></html>
