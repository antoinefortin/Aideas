<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splinter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #16191d; --muted: #4c545e; --glass: rgba(255, 255, 255, 0.66); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9aa6ae; }
      body { font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--ink); }
      #app, canvas { display: block; width: 100%; height: 100%; }
      canvas { touch-action: none; cursor: none; }
      body.inspecting canvas { cursor: grab; }

      .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 8px 30px rgba(15, 20, 30, 0.18); }
      .hud { position: fixed; top: 16px; left: 16px; max-width: min(430px, calc(100vw - 32px)); padding: 14px 16px 12px; border-radius: 12px; pointer-events: none; user-select: none; }
      .hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
      .hud h1 span { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #c4361d; vertical-align: 1px; }
      .hud p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
      .hud kbd, .chip kbd { font: 500 11px Inter, system-ui, sans-serif; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.08); color: var(--ink); }
      #stats { margin-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }

      #crosshair { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; transform: translate(50vw, 47vh); z-index: 5; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
      #crosshair::after { left: -2px; top: -2px; width: 4px; height: 4px; background: #fff; border: 0; }
      body.inspecting #crosshair { display: none; }

      #ammo { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 14px; max-width: calc(100vw - 32px); overflow-x: auto; }
      .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border: 0; border-radius: 9px;
        font: 500 12px Inter, system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.55); cursor: pointer; }
      .chip:hover { background: rgba(255,255,255,.9); }
      .chip.active { background: #16191d; color: #fff; }
      .chip.active kbd { background: rgba(255,255,255,.18); color: #fff; }
      body.inspecting #ammo { display: none; }

      #inspectHint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; font-size: 13px; display: none; }
      body.inspecting #inspectHint { display: block; }

      #loader { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 999px; font-size: 13px; }
      #loader.hidden { display: none; }
      #loader.error { color: #a5321b; }

      body .lil-gui { --background-color: rgba(255,255,255,.76); --text-color: #16191d; --title-background-color: rgba(255,255,255,.9);
        --title-text-color: #16191d; --widget-color: rgba(22,25,29,.09); --hover-color: rgba(22,25,29,.15); --focus-color: rgba(22,25,29,.2);
        --number-color: #8c2a17; --string-color: #8c2a17; --font-family: Inter, system-ui, sans-serif; }
      body .lil-gui.root { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 10px; overflow: hidden; top: 16px !important; right: 16px !important; }
      @media (max-width: 760px) { .hud { top: 10px; left: 10px; padding: 10px 12px; } .hud p.hint { display: none; } }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud glass">
      <h1><span></span>Splinter</h1>
      <p class="hint"><b>Click</b> (or <kbd>Space</kbd>) to fire at the cursor · hold <b>right-click</b> (or <kbd>Z</kbd>) to zoom · <kbd>1</kbd>–<kbd>3</kbd> ammo · <kbd>I</kbd> inspect the board (orbit round the back) · <kbd>G</kbd> inspect the gun · <kbd>C</kbd> new board.</p>
      <div id="stats">—</div>
    </div>
    <div id="crosshair"></div>
    <nav id="ammo" class="glass" aria-label="Ammunition"></nav>
    <div id="inspectHint" class="glass">Drag to orbit, scroll to zoom · <b>Esc</b> to go back to shooting</div>
    <div id="loader" class="glass">Loading…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
