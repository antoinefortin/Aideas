<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuitarTune — Chromatic Tuner + Tuning Presets</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#2a2a2a;--accent:#ff6b35;--accent2:#e05520;--green:#22cc66;--red:#ff4455;--blue:#4f8cff;--text:#eee;--text2:#777;--radius:10px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

/* HEADER */
header{padding:20px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:24px;font-weight:800;letter-spacing:-1px}
header h1 span{color:var(--accent)}
header p{color:var(--text2);font-size:13px;margin-top:4px}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
@media(max-width:800px){.main{flex-direction:column}}

/* SIDEBAR — TUNINGS */
.sidebar{width:280px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;background:var(--surface)}
@media(max-width:800px){.sidebar{width:100%;max-height:200px;border-right:none;border-bottom:1px solid var(--border)}}
.sidebar h2{font-size:12px;font-weight:700;color:var(--text2);padding:14px 16px 8px;text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;background:var(--surface);z-index:1}
.tuning-group{margin-bottom:4px}
.tuning-group-title{font-size:11px;font-weight:600;color:var(--accent);padding:6px 16px;text-transform:uppercase;letter-spacing:0.5px}
.tuning-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 16px;font-size:13px;font-family:inherit;cursor:pointer;transition:background 0.1s;border-left:3px solid transparent}
.tuning-btn:hover{background:var(--surface2)}
.tuning-btn.active{background:var(--surface2);border-left-color:var(--accent);font-weight:600}
.tuning-btn .tuning-notes{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);margin-top:2px}

/* TUNER AREA */
.tuner-area{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px;overflow-y:auto}

/* MIC BUTTON */
.mic-btn{width:64px;height:64px;border-radius:50%;border:3px solid var(--border);background:var(--surface);color:var(--text2);font-size:24px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.mic-btn.active{border-color:var(--green);color:var(--green);box-shadow:0 0 20px rgba(34,204,102,0.3);animation:pulse 2s infinite}
.mic-btn:hover{border-color:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(34,204,102,0.2)}50%{box-shadow:0 0 30px rgba(34,204,102,0.5)}}

/* NOTE DISPLAY */
.note-display{text-align:center;margin-bottom:24px}
.detected-note{font-family:'JetBrains Mono',monospace;font-size:72px;font-weight:800;line-height:1;transition:color 0.15s}
.detected-note.in-tune{color:var(--green)}
.detected-note.flat{color:var(--blue)}
.detected-note.sharp{color:var(--red)}
.detected-octave{font-size:24px;color:var(--text2);font-family:'JetBrains Mono',monospace;vertical-align:sub}
.detected-freq{font-size:14px;color:var(--text2);margin-top:4px;font-family:'JetBrains Mono',monospace}
.detected-cents{font-size:18px;font-weight:700;margin-top:4px;font-family:'JetBrains Mono',monospace}

/* GAUGE */
.gauge-wrap{width:100%;max-width:400px;margin-bottom:28px}
.gauge-bar{height:6px;background:var(--surface2);border-radius:3px;position:relative;overflow:visible}
.gauge-center{position:absolute;left:50%;top:-4px;width:2px;height:14px;background:var(--text2);transform:translateX(-50%);border-radius:1px}
.gauge-needle{position:absolute;top:-6px;width:12px;height:18px;background:var(--accent);border-radius:3px;transform:translateX(-50%);transition:left 0.08s;left:50%}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px;font-family:'JetBrains Mono',monospace}
.gauge-ticks{position:relative;height:6px}
.gauge-ticks span{position:absolute;top:0;width:1px;height:6px;background:var(--border)}

/* STRING BUTTONS */
.strings-section{width:100%;max-width:400px;margin-bottom:20px}
.strings-section h3{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
.strings-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.string-btn{width:56px;height:56px;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.string-btn .string-num{font-size:9px;color:var(--text2);font-weight:400}
.string-btn:hover{border-color:var(--accent)}
.string-btn.active{border-color:var(--green);color:var(--green);background:rgba(34,204,102,0.08)}
.string-btn.target{border-color:var(--accent);box-shadow:0 0 12px rgba(255,107,53,0.3)}
.string-btn.playing{border-color:var(--accent);background:rgba(255,107,53,0.08)}

/* REFERENCE TONE */
.ref-section{width:100%;max-width:400px;text-align:center;margin-bottom:16px}
.ref-row{display:flex;align-items:center;justify-content:center;gap:12px}
.ref-label{font-size:13px;color:var(--text2)}
.ref-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;transition:all 0.15s}
.ref-btn:hover{border-color:var(--accent)}
.ref-btn.playing{border-color:var(--green);color:var(--green)}

/* TUNING INFO */
.tuning-info{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.tuning-info h3{font-size:14px;font-weight:700;margin-bottom:6px}
.tuning-info p{font-size:13px;color:var(--text2);line-height:1.5}
.tuning-info .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tuning-info .tag{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1><span>Guitar</span>Tune</h1>
  <p>Chromatic tuner + tuning presets</p>
</header>

<div class="main">
  <div class="sidebar" id="sidebar"></div>

  <div class="tuner-area">
    <!-- MIC -->
    <button class="mic-btn" id="micBtn" title="Start microphone">&#127908;</button>

    <!-- NOTE DISPLAY -->
    <div class="note-display">
      <div><span class="detected-note" id="detectedNote">—</span><span class="detected-octave" id="detectedOctave"></span></div>
      <div class="detected-freq" id="detectedFreq">tap mic to start</div>
      <div class="detected-cents" id="detectedCents"></div>
    </div>

    <!-- GAUGE -->
    <div class="gauge-wrap">
      <div class="gauge-bar">
        <div class="gauge-center"></div>
        <div class="gauge-needle" id="gaugeNeedle"></div>
      </div>
      <div class="gauge-labels"><span>♭ flat</span><span>in tune</span><span>sharp ♯</span></div>
    </div>

    <!-- STRINGS -->
    <div class="strings-section">
      <h3 id="tuningName">Standard E</h3>
      <div class="strings-row" id="stringsRow"></div>
    </div>

    <!-- REFERENCE TONE -->
    <div class="ref-section">
      <div class="ref-row">
        <span class="ref-label">Reference tone:</span>
        <button class="ref-btn" id="btnPlayRef">Play selected string</button>
        <button class="ref-btn" id="btnStopRef">Stop</button>
      </div>
    </div>

    <!-- TUNING INFO -->
    <div class="tuning-info" id="tuningInfo">
      <h3>Standard E</h3>
      <p>The most common guitar tuning. Used in virtually every genre.</p>
      <div class="tags"><span class="tag">all genres</span></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

    tags: ['metal','djent','prog'],
  },
  dropA7: {

    name: '7-String Drop A',

/* ═══════════════════════════════════════════════════════════
   NOTE FREQUENCIES
   ═══════════════════════════════════════════════════════════ */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const A4 = 440;

function noteToFreq(noteStr) {
  /* parse "E2", "C#4", "Bb3", "F#2" etc */
  const m = noteStr.match(/^([A-G][b#]?)(\d)$/);
  if (!m) return 0;
  let name = m[1], octave = parseInt(m[2]);
  /* normalize flats to sharps */
  let idx = NOTE_NAMES.indexOf(name);
  if (idx < 0) idx = FLAT_NAMES.indexOf(name);
  if (idx < 0) return 0;
  /* MIDI number: C4 = 60, A4 = 69 */
  const midi = (octave + 1) * 12 + idx;
  return A4 * Math.pow(2, (midi - 69) / 12);
}

function freqToNote(freq) {
  if (freq <= 0) return { note: '—', octave: '', cents: 0 };
  const midi = 12 * Math.log2(freq / A4) + 69;
  const rounded = Math.round(midi);
  const cents = Math.round((midi - rounded) * 100);
  const noteIdx = ((rounded % 12) + 12) % 12;
  const octave = Math.floor(rounded / 12) - 1;
  return { note: NOTE_NAMES[noteIdx], octave, cents, midi: rounded };
}

function noteName(noteStr) {
  /* display friendly: keep flats as flats */
  return noteStr.replace(/(\d)$/, '');
}

/* ═══════════════════════════════════════════════════════════
   BUILD SIDEBAR
   ═══════════════════════════════════════════════════════════ */
const sidebar = document.getElementById('sidebar');
let currentTuning = 'standard';

function buildSidebar() {
  sidebar.innerHTML = '<h2>Tunings</h2>';
  let lastGroup = '';
  for (const [key, t] of Object.entries(TUNINGS)) {
    if (t.group !== lastGroup) {
      lastGroup = t.group;
      const gTitle = document.createElement('div');
      gTitle.className = 'tuning-group-title';
      gTitle.textContent = t.group;
      sidebar.appendChild(gTitle);
    }
    const btn = document.createElement('button');
    btn.className = 'tuning-btn' + (key === currentTuning ? ' active' : '');
    btn.dataset.key = key;
    btn.innerHTML = `${t.name}<div class="tuning-notes">${t.strings.map(s => noteName(s)).join(' ')}</div>`;
    btn.onclick = () => selectTuning(key);
    sidebar.appendChild(btn);
  }
}

function selectTuning(key) {
  currentTuning = key;
  stopRef();
  document.querySelectorAll('.tuning-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  buildStrings();
  updateTuningInfo();
}

/* ═══════════════════════════════════════════════════════════
   BUILD STRINGS
   ═══════════════════════════════════════════════════════════ */
let targetStringIdx = null;

function buildStrings() {
  const t = TUNINGS[currentTuning];
  document.getElementById('tuningName').textContent = t.name;
  const row = document.getElementById('stringsRow');
  row.innerHTML = '';
  t.strings.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'string-btn';
    btn.innerHTML = `<span>${noteName(s)}</span><span class="string-num">${i === 0 ? 'low' : i === t.strings.length - 1 ? 'high' : (i + 1)}</span>`;
    btn.onclick = () => {
      targetStringIdx = i;
      document.querySelectorAll('.string-btn').forEach(b => b.classList.remove('target'));
      btn.classList.add('target');
      playRefTone(noteToFreq(s));
    };
    row.appendChild(btn);
  });
}

function updateTuningInfo() {
  const t = TUNINGS[currentTuning];
  const info = document.getElementById('tuningInfo');
  info.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><div class="tags">${t.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
}

/* ═══════════════════════════════════════════════════════════
   REFERENCE TONE (WEB AUDIO OSCILLATOR)
   ═══════════════════════════════════════════════════════════ */
let audioCtx = null;
let refOsc = null, refGain = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playRefTone(freq) {
  stopRef();
  const ctx = getAudioCtx();
  refOsc = ctx.createOscillator();
  refGain = ctx.createGain();
  refOsc.type = 'sine';
  refOsc.frequency.value = freq;
  refGain.gain.value = 0.15;
  refOsc.connect(refGain).connect(ctx.destination);
  refOsc.start();
  document.getElementById('btnPlayRef').classList.add('playing');
}

function stopRef() {
  if (refOsc) { try { refOsc.stop(); } catch(e){} refOsc = null; }
  document.getElementById('btnPlayRef').classList.remove('playing');
}

document.getElementById('btnPlayRef').onclick = () => {
  const t = TUNINGS[currentTuning];
  const idx = targetStringIdx != null ? targetStringIdx : 0;
  const freq = noteToFreq(t.strings[idx]);
  playRefTone(freq);
};
document.getElementById('btnStopRef').onclick = stopRef;

/* ═══════════════════════════════════════════════════════════
   FFT PITCH DETECTION (AUTOCORRELATION)
   ═══════════════════════════════════════════════════════════ */
let micStream = null, analyser = null, detecting = false;
const FFT_SIZE = 4096;

document.getElementById('micBtn').onclick = toggleMic;

async function toggleMic() {
  if (detecting) {
    stopMic();
    return;
  }
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const source = ctx.createMediaStreamSource(micStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    source.connect(analyser);
    detecting = true;
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('detectedFreq').textContent = 'listening...';
    detectPitch();
  } catch (e) {
    toast('Microphone access denied');
  }
}

function stopMic() {
  detecting = false;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('detectedNote').textContent = '—';
  document.getElementById('detectedNote').className = 'detected-note';
  document.getElementById('detectedOctave').textContent = '';
  document.getElementById('detectedFreq').textContent = 'tap mic to start';
  document.getElementById('detectedCents').textContent = '';
  document.getElementById('gaugeNeedle').style.left = '50%';
}

function detectPitch() {
  if (!detecting || !analyser) return;
  requestAnimationFrame(detectPitch);

  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);

  /* check signal level */
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.01) {
    document.getElementById('detectedNote').textContent = '—';
    document.getElementById('detectedNote').className = 'detected-note';
    document.getElementById('detectedOctave').textContent = '';
    document.getElementById('detectedCents').textContent = '';
    document.getElementById('detectedFreq').textContent = 'listening...';
    return;
  }

  /* autocorrelation */
  const sampleRate = getAudioCtx().sampleRate;
  const freq = autoCorrelate(buf, sampleRate);
  if (freq <= 0) return;

  const { note, octave, cents } = freqToNote(freq);

  document.getElementById('detectedNote').textContent = note;
  document.getElementById('detectedOctave').textContent = octave;
  document.getElementById('detectedFreq').textContent = freq.toFixed(1) + ' Hz';

  const absCents = Math.abs(cents);
  let status, centsText;
  if (absCents <= 3) {
    status = 'in-tune';
    centsText = '✓ in tune';
  } else if (cents < 0) {
    status = 'flat';
    centsText = cents + ' cents ♭';
  } else {
    status = 'sharp';
    centsText = '+' + cents + ' cents ♯';
  }
  document.getElementById('detectedNote').className = 'detected-note ' + status;
  document.getElementById('detectedCents').textContent = centsText;
  document.getElementById('detectedCents').style.color =
    status === 'in-tune' ? 'var(--green)' : status === 'flat' ? 'var(--blue)' : 'var(--red)';

  /* gauge needle: cents -50 to +50 mapped to 0% - 100% */
  const pct = Math.max(0, Math.min(100, 50 + cents));
  document.getElementById('gaugeNeedle').style.left = pct + '%';

  /* highlight matching string */
  highlightString(freq);
}

function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  const MAX_SAMPLES = Math.floor(SIZE / 2);
  let bestOffset = -1, bestCorr = 0, foundGoodCorr = false;
  const correlations = new Float32Array(MAX_SAMPLES);

  /* min period = sampleRate/2000 (2000Hz max), max = sampleRate/50 (50Hz min) */
  const minP = Math.floor(sampleRate / 2000);
  const maxP = Math.min(MAX_SAMPLES, Math.floor(sampleRate / 50));

  for (let offset = minP; offset < maxP; offset++) {
    let corr = 0;
    for (let i = 0; i < MAX_SAMPLES; i++) {
      corr += Math.abs(buf[i] - buf[i + offset]);
    }
    corr = 1 - corr / MAX_SAMPLES;
    correlations[offset] = corr;

    if (corr > 0.9 && corr > bestCorr) {
      bestCorr = corr;
      bestOffset = offset;
      foundGoodCorr = true;
    } else if (foundGoodCorr && corr < 0.85) {
      break; /* found the peak, don't look further */
    }
  }

  if (bestOffset === -1 || bestCorr < 0.85) return -1;

  /* parabolic interpolation for sub-sample accuracy */
  const prev = correlations[bestOffset - 1] || 0;
  const next = correlations[bestOffset + 1] || 0;
  const shift = (next - prev) / (2 * (2 * bestCorr - prev - next));
  return sampleRate / (bestOffset + (isFinite(shift) ? shift : 0));
}

function highlightString(freq) {
  const t = TUNINGS[currentTuning];
  const detected = freqToNote(freq);
  const btns = document.querySelectorAll('.string-btn');
  btns.forEach((btn, i) => {
    const stringFreq = noteToFreq(t.strings[i]);
    const stringNote = freqToNote(stringFreq);
    const match = detected.note === stringNote.note && Math.abs(detected.octave - stringNote.octave) === 0;
    btn.classList.toggle('active', match && Math.abs(detected.cents) <= 10);
    btn.classList.toggle('playing', match && Math.abs(detected.cents) > 10);
  });
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

   INIT
   ═══════════════════════════════════════════════════════════ */
buildSidebar();
buildStrings();
updateTuningInfo();
</script>
