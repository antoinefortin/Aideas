const AUDIO_ZONES = [
  { pos: new THREE.Vector3(0, 2, -8), id: 'vc6vs-l5dkc', title: 'I Write Sins Not Tragedies', radius: 18 },
  { pos: new THREE.Vector3(-8, 2, 4), id: 'cCnMhpVHMvQ', title: 'The Only Difference...', radius: 10 },

/* ═══════════════════════════════════════════════════════════
   YOUTUBE IFRAME API
   ═══════════════════════════════════════════════════════════ */
const ytPlayers = {};
let ytReady = false;
let ytApiLoaded = false;

/* load YT API script (just load the lib, don't create players yet) */
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

window.onYouTubeIframeAPIReady = function() {
  ytApiLoaded = true;
  /* don't create players here — wait for user click gesture */
};

/* called ONLY from user click (startExperience) so browser allows playback */
function initYouTubePlayers() {
  if (!ytApiLoaded || ytReady) return;
  let readyCount = 0;
  AUDIO_ZONES.forEach((z, i) => {
    const div = document.createElement('div');
    div.id = 'ytp' + i;
    document.getElementById('ytPlayers').appendChild(div);
    ytPlayers[i] = new YT.Player('ytp' + i, {
      height: '1', width: '1',
      videoId: z.id,
      playerVars: { autoplay: 1, loop: 1, playlist: z.id, controls: 0, fs: 0, modestbranding: 1 },
      events: {
        onReady: function(e) {
          e.target.setVolume(0);
          e.target.playVideo();
          readyCount++;
          if (readyCount >= AUDIO_ZONES.length) ytReady = true;
        },
        onStateChange: function(e) {
          /* if video ends, restart (backup for loop) */
          if (e.data === YT.PlayerState.ENDED) e.target.playVideo();
        }
      }
    });
  });
  /* set ytReady after a timeout fallback in case some players are slow */
  setTimeout(() => { ytReady = true; }, 3000);
}

function updateSpatialAudio() {
  if (!ytReady) return;
  let loudest = { idx: -1, vol: 0, title: '' };

  AUDIO_ZONES.forEach((z, i) => {
    const p = ytPlayers[i];
    if (!p || !p.setVolume) return;
    const dist = playerPos.distanceTo(z.pos);
    const t = Math.max(0, 1 - dist / z.radius);
    const vol = Math.round(t * t * 100); /* quadratic falloff */
    p.setVolume(muted ? 0 : vol);
    if (vol > loudest.vol) { loudest = { idx: i, vol, title: z.title }; }
  });

  const np = document.getElementById('nowPlaying');
  if (loudest.vol > 5) {
    np.textContent = '♪ NOW PLAYING: ' + loudest.title;
    np.classList.add('show');
  } else {
    np.classList.remove('show');
  }
}

function toggleMute() {
  muted = !muted;
  document.getElementById('audioIndicator').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');
}

/* ═══════════════════════════════════════════════════════════
   THREE.JS SETUP
   ═══════════════════════════════════════════════════════════ */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050204);
  scene.fog = new THREE.Fog(0x050204, 5, 35);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.copy(playerPos);

  renderer = new THREE.WebGLRenderer({ antialias: false }); /* no AA for retro look */
  renderer.setPixelRatio(1); /* force low res */
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.NoToneMapping;
  document.body.prepend(renderer.domElement);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  /* ── Toon gradient texture ──────────────────────────── */
  const toonColors = new Uint8Array([40, 80, 140, 200, 255]);
  const gradientMap = new THREE.DataTexture(toonColors, toonColors.length, 1, THREE.RedFormat);
  gradientMap.minFilter = THREE.NearestFilter;
  gradientMap.magFilter = THREE.NearestFilter;
  gradientMap.needsUpdate = true;

  function toonMat(color, emissive) {
    return new THREE.MeshToonMaterial({
      color,
      gradientMap,
      emissive: emissive || 0x000000,
      emissiveIntensity: emissive ? 0.3 : 0,
    });
  }

  /* ── Lighting — theatrical spots ────────────────────── */
  scene.add(new THREE.AmbientLight(0x1a0a08, 0.6));

  const spot1 = new THREE.SpotLight(0xc9a84c, 60, 30, PI * 0.4, 0.7, 1.5);
  spot1.position.set(0, 12, -6);
  spot1.target.position.set(0, 0, -8);
  scene.add(spot1); scene.add(spot1.target);

  const spot2 = new THREE.SpotLight(0x8b2020, 30, 25, PI * 0.5, 0.6, 1.5);
  spot2.position.set(-6, 10, 0);
  scene.add(spot2);

  const spot3 = new THREE.SpotLight(0x3a1540, 20, 25, PI * 0.5, 0.6, 1.5);
  spot3.position.set(6, 10, 0);
  scene.add(spot3);

  /* floor light glow */
  for (let i = 0; i < 6; i++) {
    const fl = new THREE.PointLight(0xc9a84c, 2, 6);
    fl.position.set((i - 2.5) * 3, 0.1, -9);
    scene.add(fl);
  }

  /* ── FLOOR ──────────────────────────────────────────── */
  const floorGeo = new THREE.PlaneGeometry(24, 40);
  const floorMat = toonMat(0x1a0c08);
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -PI / 2;
  floor.position.set(0, 0, 0);
  floor.name = 'floor';
  scene.add(floor);

  /* checkered pattern on floor */
  const tileGeo = new THREE.PlaneGeometry(2, 2);
  const tileMat1 = toonMat(0x0d0806);
  const tileMat2 = toonMat(0x1a0f0a);
  for (let x = -5; x <= 5; x++) {
    for (let z = -9; z <= 9; z++) {
      const mat = (x + z) % 2 === 0 ? tileMat1 : tileMat2;
      const tile = new THREE.Mesh(tileGeo, mat);
      tile.rotation.x = -PI / 2;
      tile.position.set(x * 2, 0.01, z * 2);
      tile.name = 'floor';
      scene.add(tile);
    }
  }

  /* ── WALLS ──────────────────────────────────────────── */
  const wallMat = toonMat(0x12080a);
  const wallMatDark = toonMat(0x0a0506);

  /* back wall (stage wall) */
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 10), wallMat);
  backWall.position.set(0, 5, -10);
  scene.add(backWall);

  /* side walls */
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), wallMat);
  leftWall.rotation.y = PI / 2;
  leftWall.position.set(-12, 5, 0);
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), wallMat);
  rightWall.rotation.y = -PI / 2;
  rightWall.position.set(12, 5, 0);
  scene.add(rightWall);

  /* ceiling */
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(24, 40), wallMatDark);
  ceiling.rotation.x = PI / 2;
  ceiling.position.set(0, 10, 0);
  scene.add(ceiling);

  /* back wall behind player */
  const rearWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 10), wallMatDark);
  rearWall.rotation.y = PI;
  rearWall.position.set(0, 5, 20);
  scene.add(rearWall);

  /* ── STAGE ──────────────────────────────────────────── */
  const stageGeo = new THREE.BoxGeometry(16, 1.2, 6);
  const stageMat = toonMat(0x2a1510);
  const stage = new THREE.Mesh(stageGeo, stageMat);
  stage.position.set(0, 0.6, -7);
  scene.add(stage);

  /* stage front edge gold trim */
  const trimGeo = new THREE.BoxGeometry(16.2, 0.15, 0.15);
  const trimMat = toonMat(0xc9a84c, 0xc9a84c);
  const trim = new THREE.Mesh(trimGeo, trimMat);
  trim.position.set(0, 1.2, -4.05);
  scene.add(trim);

  /* ── CURTAINS (low-poly flat planes) ────────────────── */
  const curtainMat = toonMat(0x6b0a0a);
  function makeCurtain(x, scaleX) {
    const geo = new THREE.PlaneGeometry(4, 9, 8, 16);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const px = pos.getX(i), py = pos.getY(i);
      pos.setZ(i, Math.sin(px * 3 + py * 0.5) * 0.4);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, curtainMat);
    m.position.set(x, 5.5, -9.8);
    m.scale.x = scaleX;
    scene.add(m);
    return m;
  }
  const curtL = makeCurtain(-6, 1);
  const curtR = makeCurtain(6, -1);

  /* curtain pelmet */
  const pelmetGeo = new THREE.BoxGeometry(16, 1.5, 0.5);
  const pelmetMat = toonMat(0x8b1515);
  const pelmet = new THREE.Mesh(pelmetGeo, pelmetMat);
  pelmet.position.set(0, 9.5, -9.5);
  scene.add(pelmet);

  /* gold trim on pelmet */
  const pelTrimGeo = new THREE.BoxGeometry(16.2, 0.1, 0.55);
  const pelTrim = new THREE.Mesh(pelTrimGeo, trimMat);
  pelTrim.position.set(0, 8.8, -9.5);
  scene.add(pelTrim);

  /* ── COLUMNS ────────────────────────────────────────── */
  const colGeo = new THREE.CylinderGeometry(0.3, 0.35, 10, 6);
  const colMat = toonMat(0x2a1a12);
  const colCapGeo = new THREE.CylinderGeometry(0.5, 0.3, 0.4, 6);
  const colCapMat = toonMat(0xc9a84c, 0xc9a84c);
  for (let side of [-1, 1]) {
    for (let z = -6; z <= 10; z += 4) {
      const col = new THREE.Mesh(colGeo, colMat);
      col.position.set(side * 10, 5, z);
      scene.add(col);
      const cap = new THREE.Mesh(colCapGeo, colCapMat);
      cap.position.set(side * 10, 10, z);
      scene.add(cap);
      const base = new THREE.Mesh(colCapGeo, colCapMat);
      base.position.set(side * 10, 0.2, z);
      scene.add(base);
    }
  }

  /* ── SEATS (simple low-poly benches) ────────────────── */
  const seatGeo = new THREE.BoxGeometry(1.2, 0.8, 0.8);
  const seatBackGeo = new THREE.BoxGeometry(1.2, 0.6, 0.15);
  const seatMat = toonMat(0x3a1818);
  for (let row = 0; row < 4; row++) {
    for (let col = -3; col <= 3; col++) {
      if (Math.abs(col) <= 1 && row <= 1) continue; /* aisle */
      const s = new THREE.Mesh(seatGeo, seatMat);
      s.position.set(col * 1.8, 0.4, 4 + row * 2.2);
      scene.add(s);
      const back = new THREE.Mesh(seatBackGeo, seatMat);
      back.position.set(col * 1.8, 0.9, 4 + row * 2.2 + 0.33);
      scene.add(back);
    }
  }

  /* ── MARQUEE SIGN (entrance) ────────────────────────── */
  const marqueeGeo = new THREE.BoxGeometry(8, 2, 0.3);
  const marqueeMat = toonMat(0x1a0a08);
  const marquee = new THREE.Mesh(marqueeGeo, marqueeMat);
  marquee.position.set(0, 7, 16);
  scene.add(marquee);
  /* marquee lights */
  for (let i = -8; i <= 8; i++) {
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), toonMat(0xc9a84c, 0xc9a84c));
    bulb.position.set(i * 0.45, 7 + (i % 2 === 0 ? 1.05 : -1.05), 15.85);
    scene.add(bulb);
  }

  /* ── CHANDELIER ─────────────────────────────────────── */
  const chandGroup = new THREE.Group();
  chandGroup.position.set(0, 9, 2);
  const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 2, 4);
  const armMat = toonMat(0xc9a84c, 0xc9a84c);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(Math.cos(a) * 1, -0.5, Math.sin(a) * 1);
    arm.rotation.z = Math.cos(a) * 0.5;
    arm.rotation.x = Math.sin(a) * 0.5;
    chandGroup.add(arm);
    const crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.15, 0),
      toonMat(0xc9a84c, 0xc9a84c)
    );
    crystal.position.set(Math.cos(a) * 1.8, -1.2, Math.sin(a) * 1.8);
    chandGroup.add(crystal);
    /* candle light */
    const cl = new THREE.PointLight(0xc9a84c, 1.5, 6);
    cl.position.copy(crystal.position).y += 0.3;
    chandGroup.add(cl);
  }
  scene.add(chandGroup);

  /* ── POSTER FRAMES (interactable) ───────────────────── */
  function makeFrame(x, y, z, rotY, w, h, color, articleKey, label) {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    group.rotation.y = rotY;

    /* frame border */
    const frameGeo = new THREE.BoxGeometry(w + 0.2, h + 0.2, 0.1);
    const frameMat = toonMat(0xc9a84c, 0xc9a84c);
    group.add(new THREE.Mesh(frameGeo, frameMat));

    /* inner canvas */
    const innerGeo = new THREE.PlaneGeometry(w, h);
    const innerMat = toonMat(color);
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.position.z = 0.06;
    group.add(inner);

    /* text label using a simple plane with color */
    /* glow indicator */
    const glowGeo = new THREE.PlaneGeometry(w + 0.6, h + 0.6);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.05 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.z = -0.05;
    group.add(glow);

    scene.add(group);

    /* register as interactable */
    inner.userData = { type: 'article', key: articleKey, label, glow: glowMat, group };
    interactables.push(inner);
    return group;
  }

  /* LEFT WALL articles */
  makeFrame(-11.8, 4, 6, PI / 2, 2.5, 3, 0x1a1008, 'origin', 'THE GENESIS — CLICK TO READ');
  makeFrame(-11.8, 4, 1, PI / 2, 2.5, 3, 0x180a0a, 'audacity', 'THE AUDACITY — CLICK TO READ');
  makeFrame(-11.8, 4, -4, PI / 2, 2.5, 3, 0x0a0a18, 'martyrdom', 'THE ONLY DIFFERENCE... — CLICK TO READ');

  /* RIGHT WALL articles */
  makeFrame(11.8, 4, 6, -PI / 2, 2.5, 3, 0x18100a, 'album', 'THE RECORD — CLICK TO READ');
  makeFrame(11.8, 4, 1, -PI / 2, 2.5, 3, 0x100a18, 'pitchfork', 'PITCHFORK 1.5/10 — CLICK TO READ');
  makeFrame(11.8, 4, -4, -PI / 2, 2.5, 3, 0x0a1808, 'lying', 'LYING IS THE MOST FUN... — CLICK TO READ');

  /* STAGE WALL (back) articles */
  makeFrame(-4, 5, -9.8, 0, 3, 3.5, 0x1a0808, 'sins', '♪ I WRITE SINS — CLICK TO READ');
  makeFrame(4, 5, -9.8, 0, 3, 3.5, 0x0a0a14, 'legacy', 'THE LEGACY — CLICK TO READ');

  /* STAGE center piece */
  makeFrame(0, 4, -9.8, 0, 4, 4.5, 0x200808, 'betterifyoudo', '♪ BUT IT\'S BETTER IF YOU DO — CLICK');

  /* REAR WALL */
  makeFrame(0, 5, 19.8, PI, 5, 3, 0x14080a, 'buildgod', '♪ BUILD GOD, THEN WE\'LL TALK — CLICK');

  /* ── FLOATING MASKS ─────────────────────────────────── */
  window._masks = [];
  const maskGeo = new THREE.SphereGeometry(0.5, 6, 4, 0, PI);
  for (let i = 0; i < 8; i++) {
    const mat = toonMat(new THREE.Color().setHSL(0.07 + Math.random() * 0.06, 0.4, 0.12 + Math.random() * 0.1));
    const mask = new THREE.Mesh(maskGeo, mat);
    const a = (i / 8) * TAU;
    const r = 6 + Math.random() * 4;
    mask.userData = { angle: a, r, speed: 0.01 + Math.random() * 0.02, yBase: 5 + Math.random() * 4 };
    mask.scale.setScalar(0.5 + Math.random() * 0.8);
    scene.add(mask);
    window._masks.push(mask);
  }

  /* ── PARTICLES (dust, low count for retro feel) ─────── */
  const pCount = 300;
  const pGeo = new THREE.BufferGeometry();
  const pPositions = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    pPositions[i * 3] = (Math.random() - 0.5) * 24;
    pPositions[i * 3 + 1] = Math.random() * 10;
    pPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  const pMat = new THREE.PointsMaterial({ color: 0xc9a84c, size: 0.06, transparent: true, opacity: 0.4 });
  window._particles = new THREE.Points(pGeo, pMat);
  scene.add(window._particles);

  /* ── FLOOR clickable plane (invisible, for navigation) ─ */
  const navFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 38),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  navFloor.rotation.x = -PI / 2;
  navFloor.position.set(0, 0.02, 0);
  navFloor.name = 'navfloor';
  scene.add(navFloor);
  interactables.push(navFloor);
  navFloor.userData = { type: 'floor' };

  /* store refs */
  window._chandGroup = chandGroup;
  window._curtL = curtL;
  window._curtR = curtR;
  window._spot1 = spot1;
  window._spot2 = spot2;
  window._spot3 = spot3;
}

/* ═══════════════════════════════════════════════════════════
   INTERACTION
   ═══════════════════════════════════════════════════════════ */
function onPointerMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function onPointerDown(e) {
  if (!started) return;
  if (articleOpen) return;
  if (e.button !== 0) return;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(interactables, false);
  if (hits.length === 0) return;

  const hit = hits[0];
  const ud = hit.object.userData;

  if (ud.type === 'floor') {
    /* click to move */
    const pt = hit.point;
    targetPos.set(
      THREE.MathUtils.clamp(pt.x, -10, 10),
      1.6,
      THREE.MathUtils.clamp(pt.z, -8, 18)
    );
    moving = true;
  } else if (ud.type === 'article') {
    openArticle(ud.key);
  }
}

function openArticle(key) {
  const a = ARTICLES[key];
  if (!a) return;
  document.getElementById('apTitle').textContent = a.title;
  document.getElementById('apBody').innerHTML = a.body;
  document.getElementById('articlePanel').classList.add('open');
  articleOpen = true;
}

function closeArticle() {
  document.getElementById('articlePanel').classList.remove('open');
  articleOpen = false;
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') closeArticle();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════════════════════ */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  /* ── keyboard look ────────────────────────────────── */
  const lookSpeed = 1.5 * dt;
  if (keys['KeyA'] || keys['ArrowLeft']) lookX -= lookSpeed;
  if (keys['KeyD'] || keys['ArrowRight']) lookX += lookSpeed;
  if (keys['KeyW'] || keys['ArrowUp']) lookY = Math.min(0.6, lookY + lookSpeed);
  if (keys['KeyS'] || keys['ArrowDown']) lookY = Math.max(-0.6, lookY - lookSpeed);

  /* ── player movement (smooth lerp to target) ──────── */
  if (moving) {
    playerPos.lerp(targetPos, 3 * dt);
    if (playerPos.distanceTo(targetPos) < 0.1) {
      moving = false;
      playerPos.copy(targetPos);
    }
    /* face movement direction */
    const dir = new THREE.Vector3().subVectors(targetPos, playerPos);
    if (dir.length() > 0.1) {
      const targetAngle = Math.atan2(dir.x, dir.z);
      lookX += (targetAngle - lookX) * 2 * dt;
    }
  }

  camera.position.copy(playerPos);
  camera.position.y += Math.sin(t * 2) * 0.02; /* subtle breathing */
  camera.rotation.set(lookY, -lookX, 0, 'YXZ');

  /* ── hover detection ──────────────────────────────── */
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(interactables, false);
  const prompt = document.getElementById('prompt');
  const crosshair = document.getElementById('crosshair');
  crosshair.style.display = 'block';

  /* reset all glows */
  interactables.forEach(obj => {
    if (obj.userData.glow) obj.userData.glow.opacity = 0.05;
  });

  if (hits.length > 0 && hits[0].object.userData.type === 'article') {
    hoveredObj = hits[0].object;
    document.body.style.cursor = 'pointer';
    prompt.textContent = hoveredObj.userData.label;
    prompt.classList.add('show');
    crosshair.style.color = '#c9a84c';
    if (hoveredObj.userData.glow) hoveredObj.userData.glow.opacity = 0.15;
  } else if (hits.length > 0 && hits[0].object.userData.type === 'floor') {
    hoveredObj = null;
    document.body.style.cursor = 'crosshair';
    prompt.textContent = 'CLICK TO WALK HERE';
    prompt.classList.add('show');
    crosshair.style.color = '#c9a84c40';
  } else {
    hoveredObj = null;
    document.body.style.cursor = 'crosshair';
    prompt.classList.remove('show');
    crosshair.style.color = '#c9a84c40';
  }

  /* ── animate scene objects ────────────────────────── */
  /* chandelier sway */
  window._chandGroup.rotation.y = Math.sin(t * 0.4) * 0.08;
  window._chandGroup.rotation.z = Math.cos(t * 0.3) * 0.02;

  /* masks orbit */
  window._masks.forEach(m => {
    m.userData.angle += m.userData.speed * dt;
    m.position.x = Math.cos(m.userData.angle) * m.userData.r;
    m.position.z = Math.sin(m.userData.angle) * m.userData.r;
    m.position.y = m.userData.yBase + Math.sin(t * 0.5 + m.userData.angle) * 1;
    m.rotation.y = m.userData.angle + PI;
  });

  /* particles drift */
  const pp = window._particles.geometry.attributes.position.array;
  for (let i = 0; i < pp.length / 3; i++) {
    pp[i * 3 + 1] -= 0.003;
    pp[i * 3] += Math.sin(t * 0.5 + i) * 0.001;
    if (pp[i * 3 + 1] < 0) pp[i * 3 + 1] = 10;
  }
  window._particles.geometry.attributes.position.needsUpdate = true;

  /* spots flicker */
  window._spot1.intensity = 60 + Math.sin(t * 1.1) * 10;
  window._spot2.intensity = 30 + Math.sin(t * 0.7 + 1) * 8;
  window._spot3.intensity = 20 + Math.cos(t * 0.9 + 2) * 6;

  /* ── spatial audio update ─────────────────────────── */
  updateSpatialAudio();

  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════════════════════ */
let loadProgress = 0;
let loadDone = false;
const enterMsg = document.getElementById('enterMsg');
const loadInterval = setInterval(() => {
  loadProgress = Math.min(100, loadProgress + 2 + Math.random() * 5);
  document.getElementById('loadBar').style.width = loadProgress + '%';
  if (loadProgress >= 100) {
    clearInterval(loadInterval);
    loadDone = true;
    enterMsg.textContent = '>>> CLICK ANYWHERE TO ENTER <<<';
    enterMsg.style.color = '#c9a84c';
  }
}, 100);

/* single global click handler for the start — catches everything */
document.addEventListener('click', function onFirstClick() {
  if (!loadDone) return; /* wait for bar to fill */
  document.removeEventListener('click', onFirstClick);
  startExperience();
});

function startExperience() {
  if (started) return;
  started = true;
  document.getElementById('loader').classList.add('done');
  /* create YouTube players NOW inside user gesture so browsers allow autoplay */
  initYouTubePlayers();
}

init();
animate();
</script>
</body>
</html>
